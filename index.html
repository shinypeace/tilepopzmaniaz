<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#153f50">
  <meta name="description" content="Wonder Match — 500 уровней, волшебные комбинации и ваше большое приключение.">
  <title>Wonder Match — Королевский сад</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/bg-critters.webp" as="image">
  <link rel="stylesheet" href="./styles/game.css">
  <link rel="stylesheet" href="./styles/responsive.css">
  <link rel="stylesheet" href="./styles/original-style.css">
  <link rel="stylesheet" href="./styles/mobile-ui.css">
</head>
<body>
  <div id="boot"><div class="boot-gem">◆</div><strong>WONDER MATCH</strong><span>Готовим маленькое чудо…</span></div>
  <div id="app" class="app" hidden>
    <main class="main">
      <header class="topbar"><div class="mobile-brand">Wonder <b>Match</b></div><div id="breadcrumb">Ваше приключение</div><div class="wallet"><span class="currency" id="star-wallet" aria-label="Звёзды"></span><button class="currency" id="coin-wallet" data-action="nav" data-page="shop" aria-label="Монеты и магазин"></button><button class="round-button" data-action="settings" aria-label="Настройки"></button></div></header>
      <section id="page-content" class="page-content" aria-label="Содержимое игры"></section>
      <section id="game-screen" class="game-screen" hidden>
        <div class="game-top"><button class="art-button" data-action="pause" aria-label="Пауза" id="game-pause"></button><div><small id="game-difficulty">Обычный</small><h1 id="game-title">Уровень 1</h1></div><button class="art-button" data-action="rules" aria-label="Правила" id="game-help"></button></div>
        <div class="game-hud"><div class="moves-panel"><span id="moves-count">20</span><small id="moves-label">ХОДЫ</small></div><div class="goals-panel"><div id="goals"></div></div><div class="score-panel" aria-label="Очки"><span id="score">0</span><small>ОЧКИ</small></div></div>
        <div class="star-meter" aria-label="Звёзды за оставшиеся ходы"><div id="star-fill"></div><span class="meter-star"></span><span class="meter-star"></span><span class="meter-star"></span></div>
        <div id="board-wrap" class="board-wrap"><div id="board" class="board" role="grid" aria-label="Игровое поле"></div><div id="combo-label" aria-live="polite"></div></div>
        <p id="game-message" class="game-message">Соберите три одинаковые фишки</p>
        <div id="tools" class="tools" aria-label="Инструменты без расхода хода"></div>
        <div class="game-footer"><span>Инструменты не тратят ходы</span><button data-action="cancel-tool" id="cancel-tool" hidden>Отмена</button></div>
      </section>
      <nav id="mobile-nav" class="mobile-nav" aria-label="Мобильная навигация"></nav>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div><button class="modal-close" data-action="close" aria-label="Закрыть"></button></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
  <noscript>Для игры требуется JavaScript. Включите его в настройках браузера.</noscript>
</body>
</html>
